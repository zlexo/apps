<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="title desc" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How the apps are hosted</title>
  <desc id="desc">An iPad or phone opens public apps straight from static files on Cloudflare's free plan. Private apps first ask for a sign-in code from Cloudflare Access, then reach a Mac at home through a tunnel; the Mac does the heavy work.</desc>
  <defs>
    <marker id="head-public" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="head-private" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ad1ff"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="438" rx="18" fill="#0a101f" stroke="#94b4ff" stroke-opacity="0.16"/>

  <!-- Devices -->
  <rect x="32" y="160" width="196" height="128" rx="14" fill="#131d33" stroke="#94b4ff" stroke-opacity="0.22"/>
  <text x="52" y="190" font-size="11.5" letter-spacing="2" fill="#7f8eab">DEVICES</text>
  <text x="52" y="219" font-size="19" font-weight="600" fill="#e8eef9">iPad and phone</text>
  <text x="52" y="245" font-size="14" fill="#8fa0ba">Home-screen apps,</text>
  <text x="52" y="265" font-size="14" fill="#8fa0ba">work offline</text>

  <!-- Cloudflare -->
  <rect x="268" y="32" width="420" height="376" rx="16" fill="#0e1627" stroke="#94b4ff" stroke-opacity="0.22"/>
  <text x="292" y="62" font-size="11.5" letter-spacing="2" fill="#7f8eab">CLOUDFLARE, FREE PLAN</text>

  <rect x="292" y="82" width="372" height="124" rx="12" fill="#131d33" stroke="#2dd4bf" stroke-opacity="0.55"/>
  <text x="312" y="110" font-size="11.5" letter-spacing="2" fill="#7f8eab">STATIC FILES</text>
  <text x="312" y="139" font-size="19" font-weight="600" fill="#e8eef9">Start page and games</text>
  <text x="312" y="165" font-size="14" fill="#8fa0ba">Served from the edge: free and unlimited.</text>
  <text x="312" y="185" font-size="14" fill="#8fa0ba">No server to run, no sign-in.</text>

  <rect x="292" y="246" width="168" height="138" rx="12" fill="#131d33" stroke="#9ad1ff" stroke-opacity="0.5"/>
  <text x="312" y="274" font-size="11.5" letter-spacing="2" fill="#7f8eab">ACCESS</text>
  <text x="312" y="303" font-size="19" font-weight="600" fill="#e8eef9">Sign-in</text>
  <text x="312" y="329" font-size="14" fill="#8fa0ba">A code by email.</text>
  <text x="312" y="349" font-size="14" fill="#8fa0ba">One sign-in for</text>
  <text x="312" y="369" font-size="14" fill="#8fa0ba">all private apps</text>

  <rect x="496" y="246" width="168" height="138" rx="12" fill="#131d33" stroke="#9ad1ff" stroke-opacity="0.5"/>
  <text x="516" y="274" font-size="11.5" letter-spacing="2" fill="#7f8eab">TUNNEL</text>
  <text x="516" y="303" font-size="19" font-weight="600" fill="#e8eef9">To the Mac</text>
  <text x="516" y="329" font-size="14" fill="#8fa0ba">The Mac dials out,</text>
  <text x="516" y="349" font-size="14" fill="#8fa0ba">so no port is open</text>
  <text x="516" y="369" font-size="14" fill="#8fa0ba">at home</text>

  <!-- The Mac -->
  <rect x="728" y="246" width="240" height="138" rx="14" fill="#131d33" stroke="#94b4ff" stroke-opacity="0.22"/>
  <text x="748" y="274" font-size="11.5" letter-spacing="2" fill="#7f8eab">AT HOME</text>
  <text x="748" y="303" font-size="19" font-weight="600" fill="#e8eef9">A Mac</text>
  <text x="748" y="329" font-size="14" fill="#8fa0ba">The heavy work: splits songs</text>
  <text x="748" y="349" font-size="14" fill="#8fa0ba">into parts, times every word,</text>
  <text x="748" y="369" font-size="14" fill="#8fa0ba">finds the beat</text>

  <!-- Legend -->
  <line x1="728" y1="122" x2="768" y2="122" stroke="#2dd4bf" stroke-width="2.5"/>
  <text x="780" y="127" font-size="14" fill="#e8eef9">Public: anyone opens it</text>
  <line x1="728" y1="162" x2="768" y2="162" stroke="#9ad1ff" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="780" y="167" font-size="14" fill="#e8eef9">Private: a code first</text>

  <!-- Paths -->
  <path d="M228,204 C262,204 258,144 288,144" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#head-public)"/>
  <path d="M228,250 C262,250 258,315 288,315" fill="none" stroke="#9ad1ff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#head-private)"/>
  <path d="M460,315 L492,315" fill="none" stroke="#9ad1ff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#head-private)"/>
  <path d="M664,315 L724,315" fill="none" stroke="#9ad1ff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#head-private)"/>
</svg>
